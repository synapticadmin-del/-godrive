name: flutter_shared
description: Shared models, services, theme and widgets for Synaptic Go Flutter apps.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  firebase_core: 3.13.1
  firebase_messaging: 15.2.6
  flutter_local_notifications: ^18.0.1
  # The shared theme sets Cairo as the app-wide type family. Declared here so
  # the design system is self-contained rather than relying on each consuming
  # app to happen to depend on google_fonts.
  google_fonts: ^6.2.1
  # navigation_button.dart launches turn-by-turn handoff URLs. Previously this
  # import resolved only because every consuming app happened to depend on
  # url_launcher itself, so the package did not analyse standalone.
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true

name = "synaptic-go-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "synaptic-go"
database_id = "c832b8fd-ca8c-4198-b7e5-cde3451c4b5a"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "52a9fa33f64d441ea311d23317464b9d"
preview_id = "52a9fa33f64d441ea311d23317464b9d"

[[r2_buckets]]
binding = "FILES"
bucket_name = "synaptic-go-files"
preview_bucket_name = "synaptic-go-files"

[durable_objects]
bindings = [
  { name = "TRIP_ROOM", class_name = "TripRoom" },
  { name = "GEO_CELL", class_name = "GeoCell" },
  { name = "CAPTAIN_INBOX", class_name = "CaptainInbox" },
  { name = "OFFER_SCHEDULER", class_name = "OfferScheduler" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripRoom", "GeoCell"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CaptainInbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OfferScheduler"]

# Notification queue: producers call env.NOTIFICATIONS.send(...) and the
# `notifications` consumer drains it as a Worker queue handler. Configure the
# queue with `wrangler queues create synaptic-go-notifications` once.
[[queues.producers]]
queue = "synaptic-go-notifications"
binding = "NOTIFICATIONS"

[[queues.consumers]]
queue = "synaptic-go-notifications"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "synaptic-go-notifications-dlq"

# Schedule dispatch for trips scheduled_for the near future + monthly B2B
# invoicing on the 1st of each month. Configure after deploy:
#   wrangler queues create synaptic-go-notifications
#   wrangler queues create synaptic-go-notifications-dlq
[triggers]
crons = [
  "*/1 * * * *",  # every minute: dispatch due scheduled trips
  "0 3 1 * *",    # 1st of month 03:00 UTC: generate company invoices
]

[[routes]]
pattern = "api.synapticstudio.tech/*"
zone_name = "synapticstudio.tech"

# ---------------------------------------------------------------------------
# Default (local dev) environment overrides
# ---------------------------------------------------------------------------
[vars]
APP_NAME = "Synaptic Go"
APP_VERSION = "0.4.0"
# SECURITY: this MUST stay "false".
# This top-level block shares its worker name ("synaptic-go-api") and its D1
# binding with [env.prod], so a bare `wrangler deploy` with no --env flag
# publishes these values directly over production. When DEV_OTP is "true" the
# API returns the OTP code in the HTTP response body (auth.ts:132), which lets
# anyone log in as any user without access to the email or phone.
# For local development run `wrangler dev`, and override this to "true" in a
# local, untracked .dev.vars file if you need the code echoed back.
DEV_OTP = "false"
DEFAULT_CITY = "cairo"
JWT_ISSUER = "synaptic-go"
# Routing engine. Self-hosted OSRM (Geofabrik Egypt extract, MLD pipeline) —
# see the E15 PR for the provisioning recipe and the health check.
#
# There is deliberately NO public default, here or in lib/routing.ts. The old
# value, router.project-osrm.org, is a demo server whose usage policy forbids
# this use, permits withdrawal without notice, and receives precise trip
# coordinates belonging to an uncontracted third party (F-21-02, F-25-08).
# `getRoute` now takes this URL as a required argument, so nothing can silently
# inherit a public endpoint again.
#
# THIS HOST MUST ANSWER BEFORE THE NEXT DEPLOY. If it does not, routing degrades
# to haversine x 1.35 exactly as it does today — except it now emits a
# `route_fallback` counter through lib/log.ts instead of failing silently. Once
# E09 flips the booking call site to `allowFallback: false`, an unreachable
# engine fails the booking rather than inventing a price.
#
# This top-level block publishes over production on a bare `wrangler deploy`
# (see the DEV_OTP note above), so it carries the production host, not a dev one.
OSRM_URL = "https://osrm.synapticstudio.tech"
# Turnstile site key is pubic-safe; can be set here. The matching secret MUST
# be set via `wrangler secret put TURNSTILE_SECRET_KEY`.
TURNSTILE_SITE_KEY = ""

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.prod]
name = "synaptic-go-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[env.prod.d1_databases]]
binding = "DB"
database_name = "synaptic-go"
database_id = "c832b8fd-ca8c-4198-b7e5-cde3451c4b5a"
migrations_dir = "../../migrations"

[[env.prod.kv_namespaces]]
binding = "SESSIONS"
id = "52a9fa33f64d441ea311d23317464b9d"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "synaptic-go-files"

[env.prod.durable_objects]
bindings = [
  { name = "TRIP_ROOM", class_name = "TripRoom" },
  { name = "GEO_CELL", class_name = "GeoCell" },
  { name = "CAPTAIN_INBOX", class_name = "CaptainInbox" },
  { name = "OFFER_SCHEDULER", class_name = "OfferScheduler" }
]

[[env.prod.queues.producers]]
queue = "synaptic-go-notifications"
binding = "NOTIFICATIONS"

[[env.prod.queues.consumers]]
queue = "synaptic-go-notifications"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "synaptic-go-notifications-dlq"

[env.prod.triggers]
crons = ["*/1 * * * *", "0 3 1 * *"]

[env.prod.vars]
APP_NAME = "Synaptic Go"
APP_VERSION = "0.4.0"
DEV_OTP = "false"   # Force real OTP delivery in prod — must run with WhatsApp/email secret
DEFAULT_CITY = "cairo"
JWT_ISSUER = "synaptic-go"
# Routing engine. Self-hosted OSRM (Geofabrik Egypt extract, MLD pipeline) —
# see the E15 PR for the provisioning recipe and the health check.
#
# There is deliberately NO public default, here or in lib/routing.ts. The old
# value, router.project-osrm.org, is a demo server whose usage policy forbids
# this use, permits withdrawal without notice, and receives precise trip
# coordinates belonging to an uncontracted third party (F-21-02, F-25-08).
# `getRoute` now takes this URL as a required argument, so nothing can silently
# inherit a public endpoint again.
#
# THIS HOST MUST ANSWER BEFORE THE NEXT DEPLOY. If it does not, routing degrades
# to haversine x 1.35 exactly as it does today — except it now emits a
# `route_fallback` counter through lib/log.ts instead of failing silently. Once
# E09 flips the booking call site to `allowFallback: false`, an unreachable
# engine fails the booking rather than inventing a price.
OSRM_URL = "https://osrm.synapticstudio.tech"
TURNSTILE_SITE_KEY = "0x4AAAAAAA" # placeholder — set your site key

[env.prod.observability]
enabled = true


name: synaptic_go_rider
description: GoDrive — Rider app (Egypt ride-hailing)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  provider: ^6.1.2
  web_socket_channel: ^2.4.0
  intl: ^0.19.0
  firebase_core: 3.13.1
  firebase_messaging: 15.2.6
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  share_plus: ^10.1.0
  flutter_localized_locales: ^2.0.5
  flutter_shared:
    path: ../../packages/flutter_shared
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/

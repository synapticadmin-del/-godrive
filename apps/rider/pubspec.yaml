name: tempo_rider
description: Tempo — Rider app (Egypt ride-hailing)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  # Declares the multipart image MIME type on uploads (POST /user/avatar),
  # which the server now matches against its accepted-image whitelist.
  #
  # The constraint is ^4.0.0 rather than ^4.1.0: MediaType has existed since
  # 4.0.x, and 4.0.2 is what pubspec.lock already pins (http pulls it in).
  # Requiring 4.1.0 left the manifest unsatisfiable by its own lockfile, so
  # `pub get --enforce-lockfile` fails and a plain `pub get` silently rewrites
  # the pin. ^4.0.0 is satisfied by the pinned 4.0.2 with no version change.
  http_parser: ^4.0.0
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  flutter_secure_storage: ^9.2.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  web_socket_channel: ^2.4.0
  intl: ^0.19.0
  firebase_core: 3.13.1
  firebase_messaging: 15.2.6
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  # Profile photos: the rider picks from their camera or gallery. iOS already
  # declares NSCameraUsageDescription and NSPhotoLibraryUsageDescription; on
  # Android the plugin uses ACTION_IMAGE_CAPTURE and the system photo picker,
  # neither of which needs a manifest permission — declaring CAMERA would
  # actually make the capture intent require a runtime grant it does not need.
  image_picker: ^1.1.2
  share_plus: ^10.1.0
  flutter_localized_locales: ^2.0.5
  flutter_shared:
    path: ../../packages/flutter_shared
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
